<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mon site - Alcy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .chat-icon {
            font-size: 80px;
            margin: 30px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        button {
            background: white;
            color: #764ba2;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-icon">💬</div>
        <h1>Bienvenue sur mon site !</h1>
        <p>Étudiant • Passionné de tech</p>
        <button onclick="alert('Salut ! Merci de visiter mon site 🚀')">Me contacter</button>
    </div>
</body>
</html>
